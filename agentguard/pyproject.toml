[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentguard"
version = "0.1.0"
description = "Autonomous AI System Supervisor and Guardrail"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "websockets>=12.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.1",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "python-ulid>=2.4.0",
    "structlog>=24.1.0",
    "pyahocorasick>=2.1.0",
    "PyYAML>=6.0.1",
    "idna>=3.6",
    "tenacity>=8.2.3",
    "orjson>=3.10.0",
    "pynacl>=1.5.0",
    "tree-sitter>=0.21.3",
    "tree-sitter-bash>=0.21.0",
    "bashlex>=0.18",
    "docker>=7.0.0",
    "mitmproxy>=10.2.0",
    "tldextract>=5.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.0",
    "ruff>=0.3.0",
    "mypy>=1.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agentguard"]

[tool.mypy]
strict = true
exclude = ["tests"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
